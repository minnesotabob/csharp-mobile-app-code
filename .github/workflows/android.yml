name: Android starter build
on:
  push:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Record environment
        run: |
          dotnet --info
          dotnet workload list
          java -version
      - name: Install Android SDK dependencies
        shell: pwsh
        run: >
          dotnet build src/GnazzosWorld.App/GnazzosWorld.App.csproj
          -t:InstallAndroidDependencies -f net11.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSdkLicenses=True
      - name: Compile Android starter
        shell: pwsh
        run: >
          dotnet build src/GnazzosWorld.App/GnazzosWorld.App.csproj
          -f net11.0-android -c Debug
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: '**/obj/**/*.log'
          if-no-files-found: ignore
          retention-days: 7
