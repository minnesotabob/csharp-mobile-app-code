name: Android starter build
on:
  push:
    paths:
      - 'src/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/gnazzo-dotnet
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android MAUI workload
        run: dotnet workload install maui-android --version 11.0.100
      - name: Record environment
        run: |
          dotnet --info
          dotnet workload list
          java -version
      - name: Install Android SDK dependencies
        shell: pwsh
        run: >
          dotnet build src/GnazzosWorld.App/GnazzosWorld.App.csproj
          -t:InstallAndroidDependencies -f net11.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSdkLicenses=True
      - name: Compile Android starter
        shell: pwsh
        run: >
          dotnet build src/GnazzosWorld.App/GnazzosWorld.App.csproj
          -f net11.0-android -c Debug
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          "-p:JavaSdkDirectory=$env:JAVA_HOME"
      - name: Verify merged background audio manifest
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/GnazzosWorld.App/obj/Debug/net11.0-android/android/AndroidManifest.xml
          $ns = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $ns.AddNamespace('android', 'http://schemas.android.com/apk/res/android')
          foreach ($permission in @('android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK', 'android.permission.POST_NOTIFICATIONS')) {
            if (!$manifest.SelectSingleNode("/manifest/uses-permission[@android:name='$permission']", $ns)) { throw "Missing $permission" }
          }
          $service = $manifest.SelectSingleNode("/manifest/application/service[@android:name='communityToolkit.maui.media.services']", $ns)
          if (!$service -or $service.GetAttribute('foregroundServiceType', 'http://schemas.android.com/apk/res/android') -ne 'mediaPlayback') { throw 'Missing media playback service declaration' }
          $linkFilter = $manifest.SelectSingleNode("/manifest/application/activity/intent-filter[action[@android:name='android.intent.action.VIEW'] and category[@android:name='android.intent.category.BROWSABLE'] and category[@android:name='android.intent.category.DEFAULT'] and data[@android:scheme='gnazzosworld'] and data[@android:host='open']]", $ns)
          if (!$linkFilter) { throw 'Missing lab link intent filter' }
          Write-Host $linkFilter.OuterXml
          Write-Host 'Merged notification permission/link filter passed (configuration only).'
          Write-Host 'Merged background audio manifest passed (configuration only; no device playback claim).'
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: '**/obj/**/*.log'
          if-no-files-found: ignore
          retention-days: 7
