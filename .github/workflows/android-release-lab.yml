name: Disposable Android Release signing and upgrade
on:
  push:
    paths:
      - 'src/**'
      - 'eng/android-release-lab/Build-ReleaseLab.ps1'
      - 'eng/android-release-lab/audit.py'
      - 'eng/android-release-lab/test_audit.py'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/android-release-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/gnazzo-release-dotnet
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package audit guards
        run: python -m unittest discover -s eng/android-release-lab -p test_audit.py
      - name: Install Android workload
        run: dotnet workload install maui-android --version 11.0.100
      - name: Install Android dependencies
        shell: pwsh
        run: >
          dotnet build src/GnazzosWorld.App -t:InstallAndroidDependencies
          -f net11.0-android "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
          "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSdkLicenses=True
      - name: Retrieve pinned official bundletool
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'bundletool-all-1.18.3.jar'
          Invoke-WebRequest 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29') { throw 'Bundletool digest mismatch' }
      - name: Publish three isolated signed Release packages
        shell: pwsh
        run: ./eng/android-release-lab/Build-ReleaseLab.ps1
      - name: Verify actual package identities and signatures
        shell: pwsh
        run: >
          python eng/android-release-lab/audit.py
          --directory artifacts/android-release-lab --sdk "$env:ANDROID_HOME" --java "$env:JAVA_HOME"
          --bundletool "$env:RUNNER_TEMP/bundletool-all-1.18.3.jar"
          --revision ${{ github.sha }} --run-id ${{ github.run_id }}
      - name: Transfer only disposable public packages and safe metadata
        uses: actions/upload-artifact@v4
        with:
          name: disposable-android-release-lab
          path: |
            artifacts/android-release-lab/v1.apk
            artifacts/android-release-lab/v2.apk
            artifacts/android-release-lab/v2.aab
            artifacts/android-release-lab/package-evidence.json
          retention-days: 7
          if-no-files-found: error
  upgrade:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: disposable-android-release-lab
          path: artifacts/android-release-lab
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual install, launch and upgrade on isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python eng/android-release-lab/smoke.py --directory artifacts/android-release-lab
      - name: Preserve safe emulator evidence only
        uses: actions/upload-artifact@v4
        with:
          name: android-upgrade-safe-evidence
          path: artifacts/android-release-lab/upgrade-evidence.json
          retention-days: 7
          if-no-files-found: error

